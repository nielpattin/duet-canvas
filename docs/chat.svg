<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 560 440" width="560" height="440" fill="none" stroke="currentColor" stroke-width="1" role="img" aria-labelledby="chat-title chat-desc" font-family="Cal Sans, sans-serif" font-size="11" data-plotter-mode="conceptual">
  <title id="chat-title">One server, five agent CLIs</title>
  <desc id="chat-desc">The browser opens a WebSocket to /chat, which the server accepts only with the token cookie. The server starts the agent CLI you picked and talks to it over stdio: omp and pi with --mode rpc, claude with -p and stream-json, codex with app-server, opencode with acp. Whichever agent it is, it calls back into the same server over MCP, with only the canvas tools.</desc>
  <style>
    svg { color: #171717; }
    @media (prefers-color-scheme: dark) { svg { color: #ededed; } }
    text { fill: currentColor; font-weight: 400; }
    .a { animation-duration: 2s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .dot { fill: currentColor; stroke: none; opacity: 0; }
    .c1 { fill-opacity: .5; animation-delay: .05s; }
    .c2 { fill-opacity: .25; animation-delay: .1s; }
    .row { fill: currentColor; fill-opacity: .09; stroke: none; opacity: 0; animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .ping { opacity: 0; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; }
    .flash { fill: currentColor; fill-opacity: .08; stroke: none; opacity: 0; }
    .ws circle { animation-name: ws; } .stdio circle { animation-name: stdio; } .mcp circle { animation-name: mcp; }
    .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; }
    .r0 { animation-name: r0; } .r1 { animation-name: r1; } .r2 { animation-name: r2; } .r3 { animation-name: r3; } .r4 { animation-name: r4; }
    @keyframes ws { 0% { transform: translate(112px, 200px); opacity: 1; } 25% { transform: translate(200px, 200px); opacity: 1; } 25.1%, 100% { transform: translate(200px, 200px); opacity: 0; } }
    @keyframes stdio { 0%, 25% { transform: translate(288px, 200px); opacity: 0; } 25.1% { opacity: 1; } 50% { transform: translate(376px, 200px); opacity: 1; } 50.1%, 100% { transform: translate(376px, 200px); opacity: 0; } }
    @keyframes mcp { 0%, 55% { transform: translate(456px, 300px); opacity: 0; } 55.1% { opacity: 1; } 59.6% { transform: translate(456px, 340px); } 84% { transform: translate(244px, 340px); } 95% { transform: translate(244px, 244px); opacity: 1; } 95.1%, 100% { transform: translate(244px, 244px); opacity: 0; } }
    @keyframes p1 { 0%, 24.9% { opacity: 0; transform: scale(1); } 25% { opacity: .6; transform: scale(1); } 40%, 100% { opacity: 0; transform: scale(4.5); } }
    @keyframes p2 { 0%, 49.9% { opacity: 0; transform: scale(1); } 50% { opacity: .6; transform: scale(1); } 65%, 100% { opacity: 0; transform: scale(4.5); } }
    @keyframes p3 { 0% { opacity: .25; transform: scale(3); } 10%, 94.9% { opacity: 0; transform: scale(4.5); } 95% { opacity: .6; transform: scale(1); } 100% { opacity: .25; transform: scale(3); } }
    @keyframes s1 { 0%, 24.9% { opacity: 0; } 27% { opacity: 1; } 42%, 100% { opacity: 0; } }
    @keyframes s2 { 0% { opacity: .7; } 12%, 94.9% { opacity: 0; } 97% { opacity: 1; } 100% { opacity: .7; } }
    @keyframes r0 { 0%, 8.7% { opacity: 0; } 9%, 17% { opacity: 1; } 17.3%, 100% { opacity: 0; } }
    @keyframes r1 { 0%, 28.7% { opacity: 0; } 29%, 37% { opacity: 1; } 37.3%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 48.7% { opacity: 0; } 49%, 57% { opacity: 1; } 57.3%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 68.7% { opacity: 0; } 69%, 77% { opacity: 1; } 77.3%, 100% { opacity: 0; } }
    @keyframes r4 { 0%, 88.7% { opacity: 0; } 89%, 97% { opacity: 1; } 97.3%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .a, .row { animation: none !important; } }
  </style>

  <!-- The browser and the server share a centre line (y = 200) with the middle row of the agent column. -->
  <rect x="24" y="156" width="88" height="88"/>
  <rect x="200" y="156" width="88" height="88"/>
  <rect x="376" y="100" width="160" height="200"/>
  <path d="M376 140H536M376 180H536M376 220H536M376 260H536" stroke-opacity=".32"/>

  <!-- Connections carry traffic both ways, so they have no heads. -->
  <path d="M112 200H200"/>
  <path d="M288 200H376"/>

  <!-- The way back: every agent calls the server over MCP. One elbow, a head where it arrives. -->
  <path d="M456 300V340H244V244"/>
  <path d="M239.757 248.243L244 244L248.243 248.243"/>

  <!-- The server lights up when a prompt arrives and again when the agent calls back. -->
  <rect class="flash a s1" x="200" y="156" width="88" height="88"/>
  <rect class="flash a s2" x="200" y="156" width="88" height="88"/>

  <!-- The picked agent, painted once per pick. -->
  <g>
    <rect class="row r0" x="376" y="100" width="160" height="40"/>
    <rect class="row r1" x="376" y="140" width="160" height="40"/>
    <rect class="row r2" x="376" y="180" width="160" height="40"/>
    <rect class="row r3" x="376" y="220" width="160" height="40"/>
    <rect class="row r4" x="376" y="260" width="160" height="40"/>
  </g>

  <text stroke="none" opacity=".72" x="68" y="196" text-anchor="middle" font-size="12">Browser</text>
  <text stroke="none" opacity=".5" x="68" y="214" text-anchor="middle">tldraw</text>
  <text stroke="none" opacity=".72" x="244" y="196" text-anchor="middle" font-size="12">Server</text>
  <text stroke="none" opacity=".5" x="244" y="214" text-anchor="middle">canvas</text>
  <text stroke="none" opacity=".72" x="156" y="192" text-anchor="middle">ws /chat</text>
  <text stroke="none" opacity=".5" x="156" y="218" text-anchor="middle" font-size="10">token cookie</text>
  <text stroke="none" opacity=".72" x="332" y="192" text-anchor="middle">stdio</text>
  <text stroke="none" opacity=".72" x="350" y="358" text-anchor="middle">mcp http</text>
  <text stroke="none" opacity=".5" x="350" y="374" text-anchor="middle" font-size="10">canvas tools only</text>
  <text stroke="none" opacity=".5" x="456" y="90" text-anchor="middle">agent CLI, one per chat</text>

  <text stroke="none" opacity=".72" x="388" y="124">omp</text>
  <text stroke="none" opacity=".5" x="524" y="124" text-anchor="end" font-size="10">--mode rpc</text>
  <text stroke="none" opacity=".72" x="388" y="164">claude</text>
  <text stroke="none" opacity=".5" x="524" y="164" text-anchor="end" font-size="10">-p · stream-json</text>
  <text stroke="none" opacity=".72" x="388" y="204">codex</text>
  <text stroke="none" opacity=".5" x="524" y="204" text-anchor="end" font-size="10">app-server</text>
  <text stroke="none" opacity=".72" x="388" y="244">opencode</text>
  <text stroke="none" opacity=".5" x="524" y="244" text-anchor="end" font-size="10">acp</text>
  <text stroke="none" opacity=".72" x="388" y="284">pi</text>
  <text stroke="none" opacity=".5" x="524" y="284" text-anchor="end" font-size="10">--mode rpc</text>

  <!-- A prompt, in causal order: browser to server, server to the picked agent, then the agent's MCP call back. -->
  <circle class="ping a p1" cx="200" cy="200" r="4"/>
  <circle class="ping a p2" cx="376" cy="200" r="4"/>
  <circle class="ping a p3" cx="244" cy="244" r="4"/>
  <g class="ws"><circle class="dot a c0" r="3"/><circle class="dot a c1" r="2.4"/><circle class="dot a c2" r="1.8"/></g>
  <g class="stdio"><circle class="dot a c0" r="3"/><circle class="dot a c1" r="2.4"/><circle class="dot a c2" r="1.8"/></g>
  <g class="mcp"><circle class="dot a c0" r="3"/><circle class="dot a c1" r="2.4"/><circle class="dot a c2" r="1.8"/></g>
</svg>
