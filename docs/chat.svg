<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" fill="none" stroke="currentColor" stroke-width="1" role="img" aria-labelledby="chat-title chat-desc" font-family="Cal Sans, sans-serif" font-size="11" data-plotter-mode="conceptual">
  <title id="chat-title">One server, five agent CLIs</title>
  <desc id="chat-desc">The browser talks to the server over a WebSocket. The server starts the agent CLI you picked (omp, claude, codex, opencode or pi) and talks to it over stdio. Whichever agent it is, it comes back to the same server over MCP to read and edit the canvas.</desc>
  <style>
    svg { color: #171717; }
    @media (prefers-color-scheme: dark) { svg { color: #ededed; } }
    text { fill: currentColor; font-weight: 400; }
    .dot { fill: currentColor; stroke: none; opacity: 0; animation-duration: 2s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .row { fill: currentColor; fill-opacity: .055; stroke: none; opacity: 0; animation-duration: 10s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .ws { animation-name: ws; } .stdio { animation-name: stdio; } .mcp { animation-name: mcp; }
    .r0 { animation-name: r0; } .r1 { animation-name: r1; } .r2 { animation-name: r2; } .r3 { animation-name: r3; } .r4 { animation-name: r4; }
    @keyframes ws { 0% { transform: translate(120px, 200px); opacity: 1; } 25% { transform: translate(192px, 200px); opacity: 1; } 25.1%, 100% { transform: translate(192px, 200px); opacity: 0; } }
    @keyframes stdio { 0%, 25% { transform: translate(280px, 200px); opacity: 0; } 25.1% { opacity: 1; } 50% { transform: translate(352px, 200px); opacity: 1; } 50.1%, 100% { transform: translate(352px, 200px); opacity: 0; } }
    @keyframes mcp { 0%, 55% { transform: translate(440px, 300px); opacity: 0; } 55.1% { opacity: 1; } 59.8% { transform: translate(440px, 340px); } 85.5% { transform: translate(236px, 340px); } 95% { transform: translate(236px, 244px); opacity: 1; } 95.1%, 100% { transform: translate(236px, 244px); opacity: 0; } }
    @keyframes r0 { 0%, 8.7% { opacity: 0; } 9%, 17% { opacity: 1; } 17.3%, 100% { opacity: 0; } }
    @keyframes r1 { 0%, 28.7% { opacity: 0; } 29%, 37% { opacity: 1; } 37.3%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 48.7% { opacity: 0; } 49%, 57% { opacity: 1; } 57.3%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 68.7% { opacity: 0; } 69%, 77% { opacity: 1; } 77.3%, 100% { opacity: 0; } }
    @keyframes r4 { 0%, 88.7% { opacity: 0; } 89%, 97% { opacity: 1; } 97.3%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .dot, .row { animation: none; } }
  </style>

  <!-- The browser and the server share a centre line (y = 200) with the middle row of the agent column. -->
  <rect x="32" y="156" width="88" height="88"/>
  <rect x="192" y="156" width="88" height="88"/>
  <rect x="352" y="100" width="176" height="200"/>
  <path d="M352 140H528M352 180H528M352 220H528M352 260H528" stroke-opacity=".32"/>

  <!-- Connections carry traffic both ways, so they have no heads. -->
  <path d="M120 200H192"/>
  <path d="M280 200H352"/>

  <!-- The way back: every agent calls the server over MCP. One elbow, a head where it arrives. -->
  <path d="M440 300V340H236V244"/>
  <path d="M231.757 248.243L236 244L240.243 248.243"/>

  <!-- The picked agent, painted once per pick. -->
  <g>
    <rect class="row r0" x="352" y="100" width="176" height="40"/>
    <rect class="row r1" x="352" y="140" width="176" height="40"/>
    <rect class="row r2" x="352" y="180" width="176" height="40"/>
    <rect class="row r3" x="352" y="220" width="176" height="40"/>
    <rect class="row r4" x="352" y="260" width="176" height="40"/>
  </g>

  <text stroke="none" opacity=".72" x="76" y="196" text-anchor="middle" font-size="12">Browser</text>
  <text stroke="none" opacity=".5" x="76" y="214" text-anchor="middle">tldraw</text>
  <text stroke="none" opacity=".72" x="236" y="196" text-anchor="middle" font-size="12">Server</text>
  <text stroke="none" opacity=".5" x="236" y="214" text-anchor="middle">canvas</text>
  <text stroke="none" opacity=".72" x="156" y="192" text-anchor="middle">ws /chat</text>
  <text stroke="none" opacity=".72" x="316" y="192" text-anchor="middle">stdio</text>
  <text stroke="none" opacity=".72" x="338" y="358" text-anchor="middle">mcp http</text>
  <text stroke="none" opacity=".5" x="440" y="90" text-anchor="middle">agent CLI, one per chat</text>
    <text stroke="none" opacity=".72" x="364" y="124">omp</text>
    <text stroke="none" opacity=".5" x="516" y="124" text-anchor="end" font-size="10">rpc</text>
    <text stroke="none" opacity=".72" x="364" y="164">claude</text>
    <text stroke="none" opacity=".5" x="516" y="164" text-anchor="end" font-size="10">stream-json</text>
    <text stroke="none" opacity=".72" x="364" y="204">codex</text>
    <text stroke="none" opacity=".5" x="516" y="204" text-anchor="end" font-size="10">json-rpc</text>
    <text stroke="none" opacity=".72" x="364" y="244">opencode</text>
    <text stroke="none" opacity=".5" x="516" y="244" text-anchor="end" font-size="10">acp</text>
    <text stroke="none" opacity=".72" x="364" y="284">pi</text>
    <text stroke="none" opacity=".5" x="516" y="284" text-anchor="end" font-size="10">rpc</text>

  <!-- A prompt, in causal order: browser to server, server to the picked agent, then the agent's MCP call back. -->
  <g class="dot ws"><circle r="3"/></g>
  <g class="dot stdio"><circle r="3"/></g>
  <g class="dot mcp"><circle r="3"/></g>
</svg>
