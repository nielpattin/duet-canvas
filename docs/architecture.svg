<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" fill="none" stroke="currentColor" stroke-width="1" role="img" aria-labelledby="arch-title arch-desc" font-family="Cal Sans, sans-serif" font-size="11" data-plotter-mode="conceptual">
  <title id="arch-title">One server, two peers</title>
  <desc id="arch-desc">The browser and the coding agent each connect to the same server, at the same distance, and never to each other. An edit made in the browser reaches the server over WebSocket, the agent's edit reaches it over MCP, and the server stores both in SQLite and syncs the agent's edit back to the browser.</desc>
  <style>
    svg { color: #171717; }
    @media (prefers-color-scheme: dark) { svg { color: #ededed; } }
    text { fill: currentColor; font-weight: 400; }
    .dot { fill: currentColor; stroke: none; opacity: 0; animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .bar { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .user { animation-name: user; }
    .ctx { animation-name: ctx; }
    .agent { animation-name: agent; }
    .sync { animation-name: sync; }
    .bar1 { animation-name: bar1; }
    .bar2 { animation-name: bar2; }
    @keyframes user { 0%, 2% { transform: translate(144px, 176px); opacity: 0; } 2.1% { opacity: 1; } 14% { transform: translate(224px, 176px); opacity: 1; } 14.1%, 100% { transform: translate(224px, 176px); opacity: 0; } }
    @keyframes ctx { 0%, 22% { transform: translate(144px, 200px); opacity: 0; } 22.1% { opacity: 1; } 34% { transform: translate(224px, 200px); opacity: 1; } 34.1%, 100% { transform: translate(224px, 200px); opacity: 0; } }
    @keyframes agent { 0%, 42% { transform: translate(416px, 176px); opacity: 0; } 42.1% { opacity: 1; } 54% { transform: translate(336px, 176px); opacity: 1; } 54.1%, 100% { transform: translate(336px, 176px); opacity: 0; } }
    @keyframes sync { 0%, 62% { transform: translate(224px, 176px); opacity: 0; } 62.1% { opacity: 1; } 74% { transform: translate(144px, 176px); opacity: 1; } 74.1%, 100% { transform: translate(144px, 176px); opacity: 0; } }
    @keyframes bar1 { 0%, 14% { opacity: 0; } 16%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes bar2 { 0%, 54% { opacity: 0; } 56%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .dot, .bar { animation: none; } }
  </style>
  <g transform="translate(0 24)">
    <!-- Browser, server room + store, agent: the two peers share the room cell's height and centre line (y = 176). -->
    <rect x="32" y="128" width="112" height="96"/>
    <rect x="224" y="128" width="112" height="176"/>
    <path d="M224 224H336" stroke-opacity=".32"/>
    <rect x="416" y="128" width="112" height="96"/>

    <!-- Connections: no heads, they carry traffic both ways. -->
    <path d="M144 176H224"/>
    <path d="M336 176H416"/>

    <!-- Selection and viewport: one-way transfer, solid head on a dashed shaft that starts at the tip. -->
    <path d="M224 200H144" stroke-opacity=".32" stroke-dasharray="4 6"/>
    <path d="M219.757 195.757L224 200L219.757 204.243" stroke-opacity=".32"/>

    <!-- Equal gaps: the two peers sit the same distance from the one owner. -->
    <g stroke-opacity=".32">
      <path d="M144 120V88M224 120V88M336 120V88M416 120V88"/>
      <path d="M144 96H168M200 96H224M336 96H360M392 96H416"/>
      <path d="M140 100L148 92M220 100L228 92M332 100L340 92M412 100L420 92"/>
    </g>
    <text stroke="none" opacity=".5" x="184" y="99.5" text-anchor="middle">72</text>
    <text stroke="none" opacity=".5" x="376" y="99.5" text-anchor="middle">72</text>

    <!-- What is stored: one row per edit as it arrives. -->
    <path class="bar bar1" d="M248 284H312"/>
    <path class="bar bar2" d="M248 294H312"/>

    <text stroke="none" opacity=".72" x="88" y="172" text-anchor="middle" font-size="12">Browser</text>
    <text stroke="none" opacity=".5" x="88" y="190" text-anchor="middle">tldraw</text>
    <text stroke="none" opacity=".72" x="280" y="172" text-anchor="middle" font-size="12">TLSocketRoom</text>
    <text stroke="none" opacity=".5" x="280" y="190" text-anchor="middle">sync room</text>
    <text stroke="none" opacity=".72" x="280" y="246" text-anchor="middle" font-size="12">SQLite</text>
    <text stroke="none" opacity=".5" x="280" y="262" text-anchor="middle">canvas.db</text>
    <text stroke="none" opacity=".72" x="472" y="172" text-anchor="middle" font-size="12">Agent</text>
    <text stroke="none" opacity=".5" x="472" y="190" text-anchor="middle">MCP client</text>
    <text stroke="none" opacity=".72" x="184" y="168" text-anchor="middle">WebSocket</text>
    <text stroke="none" opacity=".72" x="376" y="168" text-anchor="middle">MCP · http</text>
    <text stroke="none" opacity=".5" x="184" y="218" text-anchor="middle">/api/context</text>

    <!-- Signals, in causal order: a browser edit, the context post, an agent edit, the sync back to the browser. -->
    <g class="dot user"><circle r="3"/></g>
    <g class="dot ctx"><circle r="3"/></g>
    <g class="dot agent"><circle r="3"/></g>
    <g class="dot sync"><circle r="3"/></g>
  </g>
</svg>
