<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" fill="none" stroke="currentColor" stroke-width="1" role="img" aria-labelledby="arch-title arch-desc" font-family="Cal Sans, sans-serif" font-size="11" data-plotter-mode="conceptual">
  <title id="arch-title">One server, two peers</title>
  <desc id="arch-desc">The browser and the coding agent each connect to the same server, and never to each other. A shape drawn in the browser reaches the server over WebSocket and is stored in SQLite. The agent then adds its own shape over MCP, the server stores that too, and syncs it back to the browser.</desc>
  <style>
    svg { color: #171717; }
    @media (prefers-color-scheme: dark) { svg { color: #ededed; } }
    text { fill: currentColor; font-weight: 400; }
    .a { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .dot { fill: currentColor; stroke: none; opacity: 0; }
    .c1 { fill-opacity: .5; animation-delay: .06s; }
    .c2 { fill-opacity: .25; animation-delay: .12s; }
    .ping { opacity: 0; vector-effect: non-scaling-stroke; transform-box: fill-box; transform-origin: center; }
    .flash { fill: currentColor; fill-opacity: .08; stroke: none; opacity: 0; }
    .user circle { animation-name: user; } .ctx circle { animation-name: ctx; } .agent circle { animation-name: agent; } .sync circle { animation-name: sync; }
    .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; }
    .f1 { animation-name: f1; } .f2 { animation-name: f2; } .fa { animation-name: fa; }
    .draw { stroke-dasharray: 1; }
    .sh1 { animation-name: sh1; } .sh2 { animation-name: sh2; } .bar1 { animation-name: bar1; } .bar2 { animation-name: bar2; }
    @keyframes user { 0%, 5.6% { transform: translate(144px, 176px); opacity: 0; } 5.7% { opacity: 1; animation-timing-function: cubic-bezier(.45, 0, .25, 1); } 16.6% { transform: translate(224px, 176px); opacity: 1; } 16.7%, 100% { transform: translate(224px, 176px); opacity: 0; } }
    @keyframes ctx { 0%, 22.2% { transform: translate(144px, 200px); opacity: 0; } 22.3% { opacity: 1; animation-timing-function: cubic-bezier(.45, 0, .25, 1); } 33.2% { transform: translate(224px, 200px); opacity: 1; } 33.3%, 100% { transform: translate(224px, 200px); opacity: 0; } }
    @keyframes agent { 0%, 42.2% { transform: translate(416px, 176px); opacity: 0; } 42.3% { opacity: 1; animation-timing-function: cubic-bezier(.45, 0, .25, 1); } 53.2% { transform: translate(336px, 176px); opacity: 1; } 53.3%, 100% { transform: translate(336px, 176px); opacity: 0; } }
    @keyframes sync { 0%, 64.4% { transform: translate(224px, 176px); opacity: 0; } 64.5% { opacity: 1; animation-timing-function: cubic-bezier(.45, 0, .25, 1); } 75.5% { transform: translate(144px, 176px); opacity: 1; } 75.6%, 100% { transform: translate(144px, 176px); opacity: 0; } }
    @keyframes p1 { 0%, 16.6% { opacity: 0; transform: scale(1); } 16.7% { opacity: .6; transform: scale(1); } 24%, 100% { opacity: 0; transform: scale(4.5); } }
    @keyframes p2 { 0%, 53.2% { opacity: 0; transform: scale(1); } 53.3% { opacity: .6; transform: scale(1); } 60.6%, 100% { opacity: 0; transform: scale(4.5); } }
    @keyframes p3 { 0%, 75.5% { opacity: 0; transform: scale(1); } 75.6% { opacity: .6; transform: scale(1); } 83%, 100% { opacity: 0; transform: scale(4.5); } }
    @keyframes f1 { 0%, 16.6% { opacity: 0; } 17.5% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes f2 { 0%, 53.2% { opacity: 0; } 54.1% { opacity: 1; } 61.6%, 100% { opacity: 0; } }
    @keyframes fa { 0%, 38% { opacity: 0; } 40% { opacity: 1; } 44%, 100% { opacity: 0; } }
    @keyframes sh1 { 0% { stroke-dashoffset: 1; opacity: 1; } 5.6%, 95.5% { stroke-dashoffset: 0; opacity: 1; } 99%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes sh2 { 0%, 75.6% { stroke-dashoffset: 1; opacity: 1; } 82.2%, 95.5% { stroke-dashoffset: 0; opacity: 1; } 99%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes bar1 { 0%, 16.7% { stroke-dashoffset: 1; opacity: 1; } 22%, 95.5% { stroke-dashoffset: 0; opacity: 1; } 99%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes bar2 { 0%, 53.3% { stroke-dashoffset: 1; opacity: 1; } 58.9%, 95.5% { stroke-dashoffset: 0; opacity: 1; } 99%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .a { animation: none !important; } }
  </style>
  <g transform="translate(0 4)">
    <!-- Browser, server room + store, agent. Both peers share the room cell's height and the connection line (y = 176). -->
    <rect class="flash a fa" x="416" y="128" width="112" height="96"/>
    <rect class="flash a f1" x="224" y="128" width="112" height="96"/>
    <rect class="flash a f2" x="224" y="128" width="112" height="96"/>
    <rect x="32" y="128" width="112" height="96"/>
    <rect x="224" y="128" width="112" height="176"/>
    <path d="M224 224H336" stroke-opacity=".32"/>
    <rect x="416" y="128" width="112" height="96"/>

    <!-- Connections: no heads, they carry traffic both ways. -->
    <path d="M144 176H224"/>
    <path d="M336 176H416"/>

    <!-- Selection and viewport: one-way transfer, solid head on a dashed shaft that starts at the tip. -->
    <path d="M224 200H144" stroke-opacity=".32" stroke-dasharray="4 6"/>
    <path d="M219.757 195.757L224 200L219.757 204.243" stroke-opacity=".32"/>

    <!-- The canvas in the browser: the user's rectangle first, then the agent's circle once it syncs back. -->
    <rect class="draw a sh1" x="48" y="184" width="28" height="20" pathLength="1"/>
    <circle class="draw a sh2" cx="112" cy="194" r="10" pathLength="1"/>

    <!-- What the server stores: one row per edit, written as it arrives. -->
    <path class="draw a bar1" d="M248 284H312" pathLength="1"/>
    <path class="draw a bar2" d="M248 294H312" pathLength="1"/>

    <text stroke="none" opacity=".72" x="88" y="150" text-anchor="middle" font-size="12">Browser</text>
    <text stroke="none" opacity=".5" x="88" y="165" text-anchor="middle">tldraw</text>
    <text stroke="none" opacity=".72" x="280" y="172" text-anchor="middle" font-size="12">TLSocketRoom</text>
    <text stroke="none" opacity=".5" x="280" y="190" text-anchor="middle">sync room</text>
    <text stroke="none" opacity=".72" x="280" y="246" text-anchor="middle" font-size="12">SQLite</text>
    <text stroke="none" opacity=".5" x="280" y="262" text-anchor="middle">canvas.db</text>
    <text stroke="none" opacity=".72" x="472" y="172" text-anchor="middle" font-size="12">Agent</text>
    <text stroke="none" opacity=".5" x="472" y="190" text-anchor="middle">MCP client</text>
    <text stroke="none" opacity=".72" x="184" y="168" text-anchor="middle">WebSocket</text>
    <text stroke="none" opacity=".72" x="376" y="168" text-anchor="middle">MCP · http</text>
    <text stroke="none" opacity=".5" x="184" y="218" text-anchor="middle">/api/context</text>

    <!-- A ring where each edit lands. -->
    <circle class="ping a p1" cx="224" cy="176" r="4"/>
    <circle class="ping a p2" cx="336" cy="176" r="4"/>
    <circle class="ping a p3" cx="144" cy="176" r="4"/>

    <!-- Signals, in causal order: a browser edit, the context post, an agent edit, the sync back to the browser. Each has a short tail. -->
    <g class="user"><circle class="dot a c0" r="3"/><circle class="dot a c1" r="2.4"/><circle class="dot a c2" r="1.8"/></g>
    <g class="ctx"><circle class="dot a c0" r="3"/><circle class="dot a c1" r="2.4"/><circle class="dot a c2" r="1.8"/></g>
    <g class="agent"><circle class="dot a c0" r="3"/><circle class="dot a c1" r="2.4"/><circle class="dot a c2" r="1.8"/></g>
    <g class="sync"><circle class="dot a c0" r="3"/><circle class="dot a c1" r="2.4"/><circle class="dot a c2" r="1.8"/></g>
  </g>
</svg>
